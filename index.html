<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soar Bucks Tracker - Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #0F172A;
    --bg-card: #1E293B;
    --bg-hover: #334155;
    --primary: #6366F1;
    --primary-hover: #4F46E5;
    --success: #10B981;
    --success-hover: #059669;
    --danger: #EF4444;
    --danger-hover: #DC2626;
    --text-main: #F8FAFC;
    --text-muted: #94A3B8;
    --border: #334155;
  }

  body {
    font-family: 'Poppins', sans-serif;
    background-color: var(--bg-main);
    color: var(--text-main);
    min-height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 15px;
  }

  .hidden { display: none !important; }

  .container {
    background: var(--bg-card);
    width: 100%;
    max-width: 550px;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.3);
    border: 1px solid var(--border);
  }

  h2 { text-align: center; font-weight: 600; margin-top: 0; margin-bottom: 25px; color: var(--text-main); }

  input {
    width: 100%;
    padding: 14px;
    margin-bottom: 15px;
    background: var(--bg-main);
    border: 2px solid var(--border);
    color: var(--text-main);
    border-radius: 10px;
    font-size: 16px;
    font-family: inherit;
    transition: border-color 0.3s ease;
    box-sizing: border-box;
  }
  input:focus { outline: none; border-color: var(--primary); }
  input::placeholder { color: var(--text-muted); }

  button {
    font-family: inherit;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.1s ease, background-color 0.2s ease;
  }
  button:active { transform: scale(0.97); }

  .btn-primary { background: var(--primary); color: white; padding: 14px; font-size: 16px; }
  .btn-primary:hover { background: var(--primary-hover); }

  .btn-success { background: var(--success); color: white; }
  .btn-success:hover { background: var(--success-hover); }

  .btn-danger { background: var(--danger); color: white; }
  .btn-danger:hover { background: var(--danger-hover); }
  
  .btn-secondary { background: var(--bg-hover); color: var(--text-main); padding: 10px 15px;}
  .btn-secondary:hover { background: var(--border); }

  /* Toolbar */
  .toolbar { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 20px; }
  .toolbar button { flex: 1; font-size: 14px; }

  .add-student-wrapper { display: flex; gap: 10px; margin-bottom: 20px; }
  .add-student-wrapper input { margin-bottom: 0; }
  .add-student-wrapper button { padding: 0 20px; white-space: nowrap; }

  /* Student Cards */
  .student-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--bg-main);
    padding: 15px 20px;
    border-radius: 12px;
    margin-bottom: 12px;
    border: 1px solid var(--border);
  }

  .student-info { display: flex; flex-direction: column; }
  .student-name { font-weight: 600; font-size: 1.1rem; }
  .remove-text { color: var(--danger); font-size: 0.8rem; cursor: pointer; margin-top: 4px; font-weight: 500; }
  
  .controls { display: flex; align-items: center; gap: 15px; }
  .points-display { font-size: 1.5rem; font-weight: 600; min-width: 35px; text-align: center; color: var(--success); }
  
  .circle-btn {
    width: 38px; height: 38px; border-radius: 50%;
    display: flex; justify-content: center; align-items: center;
    font-size: 1.4rem; padding: 0;
  }

  .reset-section { margin-top: 30px; padding-top: 25px; border-top: 2px solid var(--border); display: flex; gap: 10px;}

  /* Modal for History */
  .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px);
    display: flex; justify-content: center; align-items: center; z-index: 1000;
  }
  .modal-content {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 15px; padding: 25px; width: 90%; max-width: 500px;
    max-height: 80vh; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .modal-header h3 { margin: 0; font-size: 1.3rem; }
  .close-modal { background: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; border: none; }
  
  .history-item {
    padding: 12px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; font-size: 0.9rem;
  }
  .history-item:last-child { border-bottom: none; }
  .log-time { color: var(--text-muted); font-size: 0.8rem; display: block; }
  .log-action.positive { color: var(--success); font-weight: 600; }
  .log-action.negative { color: var(--danger); font-weight: 600; }

</style>
</head>
<body>

<div id="login-screen" class="container">
  <h2>Security Check</h2>
  <input type="password" id="passcode-input" placeholder="Enter 6-digit passcode" maxlength="6" inputmode="numeric">
  <button class="btn-primary" style="width:100%;" onclick="checkPasscode()">Unlock App</button>
</div>

<div id="app-screen" class="container hidden">
  <h2>Soar Bucks Tracker</h2>
  
  <div class="toolbar">
    <button class="btn-secondary" onclick="toggleSort()">🏆 Toggle Leaderboard</button>
    <button class="btn-secondary" onclick="openHistory()">📜 View History</button>
  </div>

  <div class="add-student-wrapper">
    <input type="text" id="new-student-name" placeholder="Enter student name...">
    <button class="btn-primary" onclick="addStudent()">Add</button>
  </div>

  <div id="student-list"></div>

  <input type="file" id="import-file" class="hidden" accept=".json" onchange="importData(event)">

  <div class="reset-section">
    <button class="btn-danger" style="flex: 1; padding: 14px; font-size: 14px;" onclick="resetAllPoints()">⚠️ Reset</button>
    <button class="btn-secondary" style="flex: 1; padding: 14px; font-size: 14px;" onclick="document.getElementById('import-file').click()">📂 Import</button>
    <button class="btn-secondary" style="flex: 1; padding: 14px; font-size: 14px;" onclick="exportData()">💾 Backup</button>
  </div>
</div>

<div id="history-modal" class="modal-overlay hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Activity Log</h3>
      <button class="close-modal" onclick="closeHistory()">&times;</button>
    </div>
    <div id="history-list"></div>
    <button class="btn-danger" style="width: 100%; margin-top: 15px; padding: 10px;" onclick="clearHistory()">Clear History</button>
  </div>
</div>

<script>
  const PASSCODE = "121319";
  let students = JSON.parse(localStorage.getItem('soarBucksStudents')) || [];
  let historyLog = JSON.parse(localStorage.getItem('soarBucksHistory')) || [];
  let isLeaderboardMode = false;

  window.onload = () => {
    if(sessionStorage.getItem('soarBucksAuth') === 'true') { unlockApp(); }
    document.getElementById('passcode-input').addEventListener('keypress', e => { if (e.key === 'Enter') checkPasscode(); });
    document.getElementById('new-student-name').addEventListener('keypress', e => { if (e.key === 'Enter') addStudent(); });
  };

  function checkPasscode() {
    if (document.getElementById('passcode-input').value === PASSCODE) {
      sessionStorage.setItem('soarBucksAuth', 'true');
      unlockApp();
    } else {
      alert("Incorrect passcode.");
      document.getElementById('passcode-input').value = '';
    }
  }

  function unlockApp() {
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('app-screen').classList.remove('hidden');
    renderStudents();
  }

  function saveData() {
    localStorage.setItem('soarBucksStudents', JSON.stringify(students));
    localStorage.setItem('soarBucksHistory', JSON.stringify(historyLog));
    renderStudents();
  }

  function logActivity(studentName, action, amount) {
    const time = new Date().toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    historyLog.unshift({ name: studentName, action: action, amount: amount, time: time });
    
    // Keep only the last 100 logs to prevent memory bloat
    if(historyLog.length > 100) historyLog.pop();
    saveData();
  }

  function addStudent() {
    const nameInput = document.getElementById('new-student-name');
    const name = nameInput.value.trim();
    if (name) {
      students.push({ id: Date.now(), name: name, points: 0 });
      logActivity(name, "Added to class", 0);
      nameInput.value = '';
      saveData();
    }
  }

  function updatePoints(id, change) {
    const student = students.find(s => s.id === id);
    if (student) {
      student.points += change;
      const actionText = change > 0 ? "Received" : "Lost";
      logActivity(student.name, actionText, Math.abs(change));
      saveData();
    }
  }

  function removeStudent(id) {
    const student = students.find(s => s.id === id);
    if(confirm(`Remove ${student.name} completely?`)) {
      logActivity(student.name, "Removed from class", 0);
      students = students.filter(s => s.id !== id);
      saveData();
    }
  }

  function resetAllPoints() {
    if(confirm("Are you sure you want to reset ALL Soar Bucks to 0?")) {
      students.forEach(s => s.points = 0);
      logActivity("Entire Class", "Points Reset", 0);
      saveData();
    }
  }

  function toggleSort() {
    isLeaderboardMode = !isLeaderboardMode;
    renderStudents();
  }

  function exportData() {
    // Package both students and history into one object
    const backupData = {
      students: students,
      history: historyLog
    };
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData));
    const dlAnchorElem = document.createElement('a');
    dlAnchorElem.setAttribute("href", dataStr);
    dlAnchorElem.setAttribute("download", "soar_bucks_backup.json");
    dlAnchorElem.click();
  }

  function importData(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const importedData = JSON.parse(e.target.result);
        
        // Handle the new combined format
        if (importedData.students) {
          students = importedData.students;
          historyLog = importedData.history || [];
        } 
        // Handle the older format (if you made a backup with the previous code)
        else if (Array.isArray(importedData)) {
          students = importedData;
        }

        saveData();
        alert("Backup imported successfully!");
      } catch (err) {
        alert("Error loading file. Please make sure it is a valid backup JSON file.");
      }
    };
    reader.readAsText(file);
    
    // Reset the input so you can import the same file again if needed
    event.target.value = '';
  }

  function openHistory() {
    const list = document.getElementById('history-list');
    list.innerHTML = '';
    
    if (historyLog.length === 0) {
      list.innerHTML = '<p style="text-align: center; color: var(--text-muted);">No activity recorded yet.</p>';
    } else {
      historyLog.forEach(log => {
        let amountText = log.amount !== 0 ? `${log.action} ${log.amount} Buck(s)` : log.action;
        let colorClass = log.action === "Received" ? "positive" : (log.action === "Lost" ? "negative" : "");
        
        list.innerHTML += `
          <div class="history-item">
            <div>
              <strong>${log.name}</strong>
              <span class="log-time">${log.time}</span>
            </div>
            <span class="log-action ${colorClass}">${amountText}</span>
          </div>
        `;
      });
    }
    document.getElementById('history-modal').classList.remove('hidden');
  }

  function closeHistory() {
    document.getElementById('history-modal').classList.add('hidden');
  }

  function clearHistory() {
    if(confirm("Clear the entire activity log?")) {
      historyLog = [];
      saveData();
      openHistory(); // refresh modal
    }
  }

  function renderStudents() {
    const list = document.getElementById('student-list');
    list.innerHTML = ''; 
    
    let displayList = [...students];
    if (isLeaderboardMode) {
      displayList.sort((a, b) => b.points - a.points);
    } else {
      displayList.sort((a, b) => a.name.localeCompare(b.name));
    }

    displayList.forEach(student => {
      const div = document.createElement('div');
      div.className = 'student-card';
      
      div.innerHTML = `
        <div class="student-info">
          <span class="student-name">${student.name}</span>
          <span class="remove-text" onclick="removeStudent(${student.id})">Remove</span>
        </div>
        <div class="controls">
          <button class="btn-danger circle-btn" onclick="updatePoints(${student.id}, -1)">-</button>
          <span class="points-display">${student.points}</span>
          <button class="btn-success circle-btn" onclick="updatePoints(${student.id}, 1)">+</button>
        </div>
      `;
      list.appendChild(div);
    });
    
    if (students.length === 0) {
      list.innerHTML = '<p style="text-align: center; color: var(--text-muted); margin: 30px 0;">No students added yet.</p>';
    }
  }
</script>

</body>
</html>
